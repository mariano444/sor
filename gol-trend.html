<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mega Giro — Girá y ganá hasta $20.000.000</title>
<meta name="description" content="Una ficha, dos juegos: girá la Rueda o raspá la Raspadita. Comprá tus fichas por transferencia y jugá en Mega Giro.">
<meta name="theme-color" content="#0a0508">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://pay.galio.app" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"></noscript>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --gold:#f5c542;--gold-2:#ffe08a;--gold-3:#b8860b;--ruby:#c1121f;--bg:#0a0508;
  --panel:rgba(26,12,20,.82);--line:rgba(245,197,66,.28);--text:#fff6e0;--muted:#b9a98a;--ok:#2ecc71;--err:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(1200px 700px at 50% -10%,#4a0b22 0%,#17060e 48%,#0a0508 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(2px 2px at 20% 30%,rgba(245,197,66,.6),transparent),radial-gradient(1.5px 1.5px at 70% 60%,rgba(245,197,66,.5),transparent),radial-gradient(2px 2px at 85% 20%,rgba(255,224,138,.5),transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(245,197,66,.4),transparent);
  background-size:420px 420px;animation:drift 40s linear infinite}
@keyframes drift{to{background-position:420px 420px}}
button{font-family:inherit;cursor:pointer}
a{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(10,5,8,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,var(--gold-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-right{display:flex;align-items:center;gap:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;background:rgba(245,197,66,.08);display:flex;align-items:center;gap:6px}
.chip b{color:var(--gold)}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:999px;width:36px;height:36px;font-size:16px}

/* demo ribbon */
.demo{background:repeating-linear-gradient(45deg,#7a5b00,#7a5b00 12px,#5c4400 12px,#5c4400 24px);text-align:center;font-size:12px;font-weight:600;padding:6px;letter-spacing:.5px}

/* hero */
.hero{text-align:center;padding:34px 0 8px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(54px,11vw,118px);line-height:.9;letter-spacing:3px;
  background:linear-gradient(180deg,#fff3c4 0%,var(--gold) 45%,var(--gold-3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(245,197,66,.35))}
.hero p{color:var(--muted);font-size:clamp(14px,2.4vw,18px);margin-top:10px}
.jackpot{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:10px 22px;border-radius:999px;border:1px solid var(--gold);
  background:linear-gradient(90deg,rgba(193,18,31,.35),rgba(245,197,66,.2),rgba(193,18,31,.35));font-weight:800;font-size:clamp(14px,3vw,20px);
  animation:pulse 2.2s ease-in-out infinite;box-shadow:0 0 30px rgba(245,197,66,.25)}
.jackpot b{font-family:'Bebas Neue',sans-serif;font-size:1.7em;letter-spacing:1px;color:var(--gold-2)}
@keyframes pulse{50%{box-shadow:0 0 55px rgba(245,197,66,.55);transform:scale(1.02)}}

/* stage */
.stage{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;padding:26px 0 36px}
@media(max-width:900px){.stage{grid-template-columns:1fr}}
.wheel-wrap{position:relative;isolation:isolate;width:min(94vw,580px);aspect-ratio:1;margin:0 auto}
.wheel-wrap::before{content:"";position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(circle,rgba(245,197,66,.28),transparent 62%);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.55;transform:scale(1.04)}}
#wheel{position:relative;z-index:1;width:100%;height:100%;display:block}
.wheel-wrap::after{content:"";position:absolute;left:10%;right:10%;bottom:-6%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent);filter:blur(7px);z-index:-1}
.rays{position:absolute;inset:-24%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .9s;z-index:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,224,138,.26) 0 4deg,transparent 4deg 14deg);
  -webkit-mask:radial-gradient(circle,transparent 36%,#000 50%,transparent 70%);mask:radial-gradient(circle,transparent 36%,#000 50%,transparent 70%);
  animation:raysspin 22s linear infinite}
.wheel-wrap.hot .rays{opacity:1}
@keyframes raysspin{to{transform:rotate(360deg)}}
@keyframes shake{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(3px,0,0)}30%,50%,70%{transform:translate3d(-6px,2px,0)}40%,60%{transform:translate3d(6px,-2px,0)}}
.stage.shake{animation:shake .7s cubic-bezier(.36,.07,.19,.97)}
/* ---- Sección del auto ---- */
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes badgepulse{50%{transform:scale(1.07) rotate(-3deg)}}
.carshow{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;padding:20px;border-radius:26px;
  background:linear-gradient(160deg,rgba(193,18,31,.22),rgba(18,6,12,.9) 70%);border:1px solid var(--line);overflow:hidden}
@media(max-width:820px){.carshow{grid-template-columns:1fr;padding:14px}}
.carframe{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;isolation:isolate;box-shadow:0 0 50px rgba(245,197,66,.22)}
.carframe::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:3px;z-index:3;pointer-events:none;
  background:conic-gradient(from var(--ang),#fff3c4,#f5c542,#c1121f,#f5c542,#fff3c4);animation:angspin 4s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.carframe img{width:100%;height:100%;object-fit:cover;display:block;animation:kenburns 14s ease-in-out infinite alternate}
.carframe::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;z-index:2;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 5.5s ease-in-out infinite;pointer-events:none}
.spark{position:absolute;z-index:4;color:#fff3c4;font-size:22px;pointer-events:none;text-shadow:0 0 12px #f5c542;animation:twinkle 2.6s ease-in-out infinite}
.carbadge{position:absolute;z-index:4;top:12px;right:12px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;padding:4px 14px;border-radius:999px;color:#3a0a12;
  background:linear-gradient(180deg,#ffe08a,var(--gold));box-shadow:0 4px 14px rgba(0,0,0,.5);animation:badgepulse 1.8s ease-in-out infinite}
.cartxt h3{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,7vw,64px);line-height:.95;letter-spacing:2px;color:var(--gold-2);margin-bottom:8px}
.cartxt p{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:16px}
.cartxt .pts{list-style:none;margin:0 0 18px;display:grid;gap:8px}
.cartxt .pts li{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.cartxt .pts li::before{content:"✔";color:#3a0a12;background:var(--gold);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.cartxt .btn{display:inline-block;width:auto;padding:15px 30px;animation:pulse 2.2s ease-in-out infinite}
.resimg.big{width:min(100%,280px);height:auto;aspect-ratio:1;border-radius:20px;margin:14px auto 4px}
/* ---- Barra fija de compra (celular) ---- */
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(10,5,8,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .35s}
.sticky-cta.on{transform:none}
@media(max-width:900px){.sticky-cta{display:block}}
.sticky-cta .btn{padding:13px 16px;font-size:15px}
.pointer{position:absolute;left:50%;top:-2%;width:10.5%;transform:translateX(-50%);z-index:3;transform-origin:50% 30%;filter:drop-shadow(0 5px 6px rgba(0,0,0,.65));will-change:transform}
.hub{position:absolute;left:50%;top:50%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:3;border:0;
  background:radial-gradient(circle at 34% 26%,#fffbe0 0,#ffe08a 16%,#f5c542 46%,#b8860b 82%,#6b4a06 100%);color:#3a0a12;font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,5vw,33px);letter-spacing:1.5px;
  text-shadow:0 1px 0 rgba(255,255,255,.65);
  box-shadow:inset 0 -7px 12px rgba(90,50,0,.6),inset 0 5px 9px rgba(255,255,255,.75),0 8px 16px rgba(0,0,0,.6);transition:transform .15s}
.hub:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.05)}
.hub:active:not(:disabled){transform:translate(-50%,-50%) scale(.95)}
.hub.ready{animation:hubpulse 1.4s ease-in-out infinite}
.hub:disabled{filter:grayscale(.35);cursor:wait}
@keyframes hubpulse{50%{box-shadow:inset 0 -7px 12px rgba(90,50,0,.6),inset 0 5px 9px rgba(255,255,255,.75),0 8px 16px rgba(0,0,0,.6),0 0 46px 8px rgba(255,224,138,.85)}}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.panel h2{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1.5px;color:var(--gold-2)}
.price{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px}
.price b{font-family:'Bebas Neue',sans-serif;font-size:56px;color:var(--gold);line-height:1}
.price span{color:var(--muted);font-size:14px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit}
.field input:focus{outline:2px solid var(--gold);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin:8px 0;line-height:1.4}
.check input{margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:800;font-size:16px;letter-spacing:.4px;
  background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,var(--gold-3));color:#3a0a12;box-shadow:0 8px 24px rgba(245,197,66,.3);transition:transform .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:6px}
.have{display:none;margin-bottom:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--ok);background:rgba(46,204,113,.1);font-size:14px}
.have.on{display:block}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
.steps div{border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.steps b{display:block;color:var(--gold);font-family:'Bebas Neue';font-size:22px}

/* sections */
section.block{padding:30px 0}
section.block h3{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:1.5px;color:var(--gold-2);margin-bottom:6px}
section.block .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.prize-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.prize{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-left-width:6px}
.prize b{font-size:15px}
.prize small{color:var(--muted);font-size:12px;white-space:nowrap}
.ticker{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.35);padding:10px 0;display:none}
.ticker.on{display:block}
.ticker-track{display:inline-flex;gap:46px;white-space:nowrap;padding-left:100%;animation:marq 38s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.prize .thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.prize .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.wcard{position:relative;padding:18px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(245,197,66,.08),rgba(255,255,255,.02))}
.wcard .top{display:flex;gap:12px;align-items:center}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#2a2230;flex:none}
.avatar.ph{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold)}
.wname{font-weight:800;font-size:16px}
.wdate{color:var(--muted);font-size:12px}
.wprize{color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1.1;margin-top:10px}
.wcomment{color:var(--muted);font-size:13.5px;line-height:1.55;font-style:italic;margin-top:6px}
.wtag{position:absolute;top:10px;right:12px;font-size:10px;font-weight:800;letter-spacing:1px;color:#3a0a12;background:var(--gold);border-radius:999px;padding:2px 8px}
.resimg{display:none;width:128px;height:128px;margin:8px auto 0;border-radius:18px;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 30px rgba(245,197,66,.4)}
[hidden]{display:none!important}
/* ---- Lista de premios animada ---- */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes angspin{to{--ang:360deg}}
@keyframes floaty{50%{transform:translateY(-7px)}}
@keyframes shine{0%,55%{transform:translateX(-140%) skewX(-20deg)}100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes ico{50%{transform:scale(1.18) rotate(-6deg)}}
.pgrid{display:flex;flex-direction:column;gap:16px}
.phero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.prest{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.pcard{position:relative;overflow:hidden;isolation:isolate;border-radius:20px;padding:18px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--pc,#3a0a1c),#12060c 88%);opacity:0;transform:translateY(28px) scale(.95);
  transition:opacity .6s ease,transform .6s cubic-bezier(.2,1.2,.4,1),box-shadow .25s}
.pcard.in{opacity:1;transform:none}
.pcard.in:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 18px 44px rgba(245,197,66,.28)}
.pcard::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:shine 5.5s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none;z-index:2}
.pcard.hero{padding:26px 22px;min-height:210px;border:0;box-shadow:0 0 36px rgba(245,197,66,.16)}
.pcard.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;z-index:1;pointer-events:none;
  background:conic-gradient(from var(--ang),#fff3c4,#f5c542,#c1121f,#f5c542,#fff3c4);animation:angspin 4s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pcard.hero.in{animation:floaty 5s ease-in-out infinite}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;z-index:-1;transition:transform .8s}
.pcard:hover .pimg{transform:scale(1.08)}
.pcard .ptop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pico{font-size:34px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));display:inline-block;animation:ico 2.6s ease-in-out infinite}
.pcard.hero .pico{font-size:46px}
.ptag{font-size:10.5px;font-weight:800;letter-spacing:1.4px;padding:3px 10px;border-radius:999px;background:linear-gradient(180deg,#ffe08a,var(--gold));color:#3a0a12;white-space:nowrap}
.pamt{font-family:'Bebas Neue','Arial Narrow',Impact,sans-serif;font-size:clamp(26px,2.6vw,34px);line-height:1.02;letter-spacing:1px;color:#fff3c4;text-shadow:0 0 22px rgba(245,197,66,.55);white-space:nowrap;overflow:hidden;text-overflow:clip}
.pcard.hero .pamt{font-size:clamp(34px,4.4vw,56px);white-space:normal}
.pcard.hero .pamt.num{white-space:nowrap}
.psub{color:rgba(255,246,224,.78);font-size:13px;margin-top:4px}
.pcta{text-align:center;margin-top:26px}
.pcta .btn{display:inline-block;width:auto;padding:16px 34px;font-size:18px;animation:pulse 2.2s ease-in-out infinite}
/* ---- Reclamo de premio ---- */
.claimbar{display:none;margin-bottom:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--gold);background:linear-gradient(90deg,rgba(193,18,31,.3),rgba(245,197,66,.16));font-size:14px;font-weight:600}
@keyframes glowbar{50%{box-shadow:0 0 34px rgba(245,197,66,.55)}}
.claimbar.on{display:block;animation:glowbar 2.2s ease-in-out infinite}
.claimbar .btn{margin-top:8px;padding:11px 14px;font-size:14px}
.photo-row{display:flex;gap:12px;align-items:center}
.photo-prev{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);background:#2a2230 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;overflow:hidden}
.photo-row input[type=file]{flex:1;min-width:0;font-size:12px;color:var(--muted);padding:8px}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;background:rgba(255,255,255,.03)}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.55}
footer{border-top:1px solid var(--line);padding:26px 0 90px;color:var(--muted);font-size:12.5px;line-height:1.6;text-align:center}
footer strong{color:var(--text)}

/* modal / toast */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.card{width:min(460px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#25101b,#14080f);border:1px solid var(--gold);border-radius:24px;padding:26px;text-align:center;box-shadow:0 0 70px rgba(245,197,66,.28);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h4{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:2px;color:var(--gold-2);line-height:1}
.card .big{font-family:'Bebas Neue',sans-serif;font-size:clamp(46px,12vw,72px);color:var(--gold);line-height:1.05;margin:8px 0;word-break:break-word}
.card p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:14px}
.card .btn{margin-top:8px}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px
